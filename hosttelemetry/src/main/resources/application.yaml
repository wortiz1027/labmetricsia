spring:
  application:
    name: mcp-server
  profiles:
    active: '@spring.profiles.active@'
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: mcp-server-host-telemetry
        version: 1.0.0
        type: SYNC
        instructions: "This streamable server provides real-detail host telemetry"
        resource-change-notification: true
        tool-change-notification: true
        prompt-change-notification: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s
springdoc:
  ai:
    mcp:
      enabled: true
      base-url: http://${OPEN_API_HOSTNAME:service-hosttelemetry}:${OPEN_API_PORT:7081}

# ==========================================
# 🚀 SECCIÓN DE OBSERVABILIDAD CORREGIDA (SPRING BOOT 4)
# ==========================================
management:
  server:
    port: 9085
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
    tags:
      application: ${spring.application.name}

logging:
  file:
    name: ${BASE_LOGS_DIR:/tmp}/mcp-server-host-telemetry.log
