spring:
  main:
    allow-bean-definition-overriding: true

  cloud:
    vault:
      uri: http://${SECRET_MANAGER_HOSTNAME:srv-secret-manage}:${SECRET_MANAGER_PORT:8200}
      authentication: TOKEN
      token: ${TOKEN_SECRET_MANAGER}
      kv:
        enabled: true
        backend: secret
        default-context: "kv/devopsmind"
        profile-separator: '/'
      fail-fast: true
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import: vault://
  jpa:
    hibernate:
      ddl-auto: validate
  storages:
    providers:
      mysql:
        url: jdbc:mysql://${DB_MYSQL_HOSTNAME:localhost}:3306/${DB_MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: ${DB_MYSQL_USERNAME}
        password: ${DB_MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          pool-name: devops-dev-hikari-pool
          minimum-idle: 2
          maximum-pool-size: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
        flyway:
          locations: classpath:db/migration/mysql
          table: schema_version_mysql
      postgres:
        url: jdbc:postgresql://${DB_POSTGRES_HOSTNAME}:5432/${DB_POSTGRES_VECTOR_NAME:labmetricsia_vector_db}
        username: ${DB_POSTGRES_USERNAME}
        password: ${DB_POSTGRES_PASSWORD}
        hikari:
          pool-name: devops-dev-hikari-pool
          minimum-idle: 2
          maximum-pool-size: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
        flyway:
          locations: classpath:db/migration/postgres
          table: schema_version_postgres
      mongodb:
        uri: mongodb://${DB_MONGO_ROOT_USERNAME:mongo}:${DB_MONGO_ROOT_PASSWORD:mongo}@${DB_MONGO_HOSTNAME:srv-mongo}:27017/${DB_MONGO_INITIAL_DB:chat_memory_db}?authSource=admin

  graphql:
    graphiql:
      enabled: true

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
    mcp:
      client:
        name: mcp-client-hot-telemetry
        version: 1.0.0
        streamable-http:
          connections:
            mcp-server-host-telemetry:
              url: http://${MCP_SERVER_HOSTNAME:hosttelemetry}:${MCP_SERVER_PORT:8081}/mcp

    ollama:
      base-url: http://${OLLAMA_SERVER_HOSTNAME:localhost}:11434
      chat:
        model: ${LLM_MODEL_NAME:llama3.2:1b}
        temperature: 0.7

management:
  # 1. Configuración de Métricas (Mapeado bajo Micrometer OTLP)
  otlp:
    metrics:
      export:
        url: http://${OTLP_METRICS_HOSTNAME:srv-alloy}:${OTLP_METRICS_PORT:4318}/v1/metrics
        step: 10s

  # 2. Configuración de Trazas y Logs (Mapeado bajo el Starter de OpenTelemetry)
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http:///${OTLP_TRACES_HOSTNAME:srv-alloy}:${OTLP_TRACES_PORT:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: http:///${OTLP_LOGS_HOSTNAME:srv-alloy}:${OTLP_LOGS_PORT:4318}/v1/logs

  # 3. Configuración del Motor de Rastreo General
  tracing:
    sampling:
      probability: 1.0
    propagation:
      consume: [W3C]
      produce: [W3C]
