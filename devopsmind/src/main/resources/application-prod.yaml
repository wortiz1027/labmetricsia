spring:
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:mysql://${DB_MYSQL_HOSTNAME:localhost}:3306/${DB_MYSQL_DATABASE_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_MYSQL_USERNAME}
    password: ${DB_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: devops-dev-hikari-pool
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    postgres:
      url: jdbc:postgresql://${DB_POSTGRES_HOSTNAME}:5432/${DB_POSTGRES_VECTOR_NAME:labmetricsia_vector_db}
      username: ${DB_POSTGRES_USERNAME}
      password: ${DB_POSTGRES_PASSWORD}
      hikari:
        pool-name: devops-dev-hikari-pool
        minimum-idle: 2
        maximum-pool-size: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000

  mongodb:
    uri: mongodb://${DB_MONGO_ROOT_USERNAME}:${DB_MONGO_ROOT_PASSWORD}@${DB_MONGO_HOSTNAME}:27017/${DB_MONGO_INITIAL_DB:chat_memory_db}?authSource=admin

  graphql:
    graphiql:
      enabled: false

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

    ollama:
      base-url: http://${OLLAMA_SERVER_HOSTNAME:localhost}:11434
      chat:
        model: ${LLM_MODEL_NAME:llama3.2:1b}
        temperature: 0.7

