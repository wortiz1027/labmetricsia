# ==============================================================================
# 🚦 CONFIGURACIÓN CRÍTICA EXCLUSIVA PARA EL ENTORNO DE INTEGRACIÓN (FAILSAFE)
# ==============================================================================
spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    vault:
      uri: http://${SECRET_MANAGER_HOSTNAME:srv-secret-manage}:${SECRET_MANAGER_PORT:8200}
      authentication: TOKEN
      token: ${TOKEN_SECRET_MANAGER}
      kv:
        enabled: true
        backend: secret
        default-context: "kv/devopsmind"
        profile-separator: '/'
      fail-fast: true
      connection-timeout: 5000
      read-timeout: 15000
  config:
    import: vault://
  data:
    mongodb:
      auto-index-creation: true
  ai:
    ollama:
      base-url: ${TEST_CONTAINER_OLLAMA_URL}
      init:
        pull-model-strategy: when_missing
      chat:
        model: llama3.2
        temperature: 0.0
    vectorstore:
      pgvector:
        initialize-schema: false
    mcp:
      client:
        name: mcp-client-host-telemetry
        version: 1.0.0
        streamable-http:
          connections:
            mcp-server-host-telemetry:
              url: http://${MCP_SERVER_HOSTNAME}:${MCP_SERVER_PORT}

  storages:
    providers:
      mysql:
        url: ${TEST_CONTAINER_MYSQL_URL}
        username: ${TEST_CONTAINER_MYSQL_USER}
        password: ${TEST_CONTAINER_MYSQL_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
      postgres:
        url: ${TEST_CONTAINER_POSTGRES_URL}
        username: ${TEST_CONTAINER_POSTGRES_USER}
        password: ${TEST_CONTAINER_POSTGRES_PASSWORD}
        driver-class-name: org.postgresql.Driver
      mongodb:
        uri: ${TEST_CONTAINER_MONGO_URI:mongodb://localhost:27017/ai_chat_memory}
